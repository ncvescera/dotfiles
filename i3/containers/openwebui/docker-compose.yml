version: "3"
services:
    ollama:
        ports:
            - 11434:11434
        volumes:
            - ollama:/root/.ollama
        restart: no
        container_name: ollama
        image: ollama/ollama
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities:
                              - gpu
        
    open-webui:
        ports:
            - 3000:8080
        volumes:
            - open-webui:/app/backend/data
        container_name: open-webui
        extra_hosts:
            - host.docker.internal:host-gateway
        depends_on:
            - ollama
        restart: no # use always for automatic startup and restart
        image: ghcr.io/open-webui/open-webui:main

volumes:
    ollama: {}
    open-webui: {}
